[project]
name = "sistema-bancario-python"
version = "1.0.0"
description = "Sistema bancário em Python com operações em funções, contas, usuários e testes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
banco = "banco.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
